[project]
name = "odile"
version = "0.1.0"
description = "ODILE: a representation-level LoRA defense against indirect prompt injection in tool-using LLM agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Mehmet Ozdincer" },
    { name = "Samuel Simko" },
    { name = "Bernhard Schölkopf" },
    { name = "Zhijing Jin" },
]

# Core dependencies cover the CLI and the AgentDojo evaluation client (which talks
# to a vLLM endpoint over the OpenAI API). Training and serving pull heavier deps
# via the optional extras below.
dependencies = [
    "openai>=1.99.1,<2.25.0",
    "pydantic[email]>=2.7.1",
    "docstring-parser>=0.15",
    "tenacity>=8.2.3",
    "typing-extensions>=4.11.0",
    "anthropic>=0.47.0",
    "cohere>=5.3.4",
    "google-genai>=1.15.0",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "deepdiff>=8.6.1",
    "rich>=13.7.1",
    "python-dotenv>=1.0.1",
    "numpy>=1.26",
    "tokenizers>=0.22.0,<0.23.0",
    "huggingface-hub>=0.24.0,<1.0.0",
]

[project.optional-dependencies]
# Required to train ODILE adapters (odile train ...) and to load adapters
# in-process with PeftModel (see examples/).
training = ["transformers>=4.41.2", "torch>=2.2.1", "peft>=0.18.1"]
# Required to serve a backbone + adapter on vLLM (odile serve ...).
serve = ["vllm>=0.8.3"]

[project.scripts]
odile = "odile.cli:main"

[project.urls]
Paper = "https://github.com/memo-ozdincer/odile-paper-package"
Adapters = "https://huggingface.co/memo-ozdincer/ODILE"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/odile", "src/agentdojo"]

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "pytest>=8.0.2",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "UP", "I", "N", "RUF"]

[tool.ruff.format]
docstring-code-format = true
